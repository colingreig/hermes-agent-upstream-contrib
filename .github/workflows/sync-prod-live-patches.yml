name: Sync prod-live-patches with main

# prod-live-patches is a release input, not a second development branch.
# Advancement is allowed only for the exact current main SHA after the
# governing push CI and its aggregate job have both completed successfully.
# Schedule/manual recovery use this same certificate path; they are not bypasses.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write
  variables: read

concurrency:
  group: sync-prod-live-patches
  cancel-in-progress: false

jobs:
  promote:
    name: Certify and promote exact main SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve exact current main SHA
        id: main
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if ! [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub returned an invalid main object id"
            exit 1
          fi
          echo "sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ steps.main.outputs.sha }}

      - name: Collect governing CI evidence
        id: evidence
        env:
          REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ steps.main.outputs.sha }}
          TRIGGER_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          FREEZE_STATE: ${{ vars.PROD_LIVE_PATCHES_FREEZE }}
          EVIDENCE_PATH: ${{ runner.temp }}/prod-live-patches-evidence.json
        run: |
          set -euo pipefail
          RUNS_PATH="$RUNNER_TEMP/ci-runs.json"
          JOBS_PATH="$RUNNER_TEMP/ci-jobs.json"
          gh api \
            "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            > "$RUNS_PATH"
          RUN_ID=$(python3 - "$RUNS_PATH" "$MAIN_SHA" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          head = sys.argv[2]
          candidates = [
              run for run in payload.get("workflow_runs", [])
              if run.get("name") == "CI"
              and run.get("path") == ".github/workflows/ci.yml"
              and run.get("event") == "push"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == head
          ]
          if not candidates:
              raise SystemExit("no exact current-main push CI run")
          latest = max(
              candidates,
              key=lambda run: (
                  int(run.get("run_number") or 0),
                  int(run.get("run_attempt") or 0),
                  int(run.get("id") or 0),
              ),
          )
          print(latest["id"])
          PY
          )
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            > "$JOBS_PATH"
          python3 - "$RUNS_PATH" "$JOBS_PATH" "$EVIDENCE_PATH" <<'PY'
          import json
          import os
          import sys

          runs_path, jobs_path, output_path = sys.argv[1:]
          raw_freeze = os.environ.get("FREEZE_STATE", "")
          try:
              freeze = json.loads(raw_freeze)
          except json.JSONDecodeError:
              freeze = {"invalid_raw_value": raw_freeze}
          evidence = {
              "repository": os.environ["REPOSITORY"],
              "current_main_sha": os.environ["MAIN_SHA"],
              "trigger_run_id": os.environ.get("TRIGGER_RUN_ID") or None,
              "freeze": freeze,
              "workflow_runs": json.load(open(runs_path, encoding="utf-8")),
              "jobs": json.load(open(jobs_path, encoding="utf-8")),
          }
          with open(output_path, "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, sort_keys=True)
              handle.write("\n")
          PY
          echo "path=$EVIDENCE_PATH" >> "$GITHUB_OUTPUT"

      - name: Certify exact SHA, aggregate job, and freeze state
        id: certificate
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/prod-live-patches-certificate.json
        run: |
          set -euo pipefail
          RESULT=$(python3 scripts/certify_prod_live_patches.py certify \
            --evidence "${{ steps.evidence.outputs.path }}" \
            --output "$CERTIFICATE_PATH")
          echo "path=$CERTIFICATE_PATH" >> "$GITHUB_OUTPUT"
          echo "id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)[\"certificate_id\"])' <<<"$RESULT")" \
            >> "$GITHUB_OUTPUT"

      - name: Prepare strict descendant promotion
        id: prepare
        env:
          CERTIFIED_SHA: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/prod-live-patches:refs/remotes/origin/prod-live-patches
          OBSERVED_MAIN=$(git rev-parse refs/remotes/origin/main)
          OBSERVED_PROD=$(git rev-parse refs/remotes/origin/prod-live-patches)
          if [ "$OBSERVED_MAIN" != "$CERTIFIED_SHA" ]; then
            echo "::error::main moved after certification"
            exit 1
          fi
          echo "prod_sha=$OBSERVED_PROD" >> "$GITHUB_OUTPUT"
          if [ "$OBSERVED_PROD" = "$CERTIFIED_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$OBSERVED_PROD" "$CERTIFIED_SHA"; then
            echo "::error::prod-live-patches is not an ancestor of certified main"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create content-addressed promotion receipt
        if: steps.prepare.outputs.changed == 'true'
        id: receipt
        env:
          RECEIPT_DIR: ${{ runner.temp }}/prod-live-patches-receipt
        run: |
          set -euo pipefail
          RECEIPT_PATH=$(python3 scripts/certify_prod_live_patches.py receipt \
            --certificate "${{ steps.certificate.outputs.path }}" \
            --output-dir "$RECEIPT_DIR" \
            --from-sha "${{ steps.prepare.outputs.prod_sha }}" \
            --authority-run-id "$GITHUB_RUN_ID" \
            --authority-run-attempt "$GITHUB_RUN_ATTEMPT")
          RECEIPT_ID=${RECEIPT_PATH##*promotion-receipt-}
          RECEIPT_ID=${RECEIPT_ID%.json}
          RECEIPT_BLOB=$(git hash-object -w "$RECEIPT_PATH")
          [ "$(git cat-file -t "$RECEIPT_BLOB")" = blob ] || {
            echo "::error::promotion receipt was not written as a Git blob"
            exit 1
          }
          [ "$(sha256sum "$RECEIPT_PATH" | awk '{print $1}')" = "$RECEIPT_ID" ] || {
            echo "::error::promotion receipt content ID mismatch"
            exit 1
          }
          {
            echo "path=$RECEIPT_PATH"
            echo "id=$RECEIPT_ID"
            echo "blob=$RECEIPT_BLOB"
            echo "ref=refs/tags/prod-live-patches-promotion-$RECEIPT_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Re-read freeze, CAS assert, and atomically publish branch and receipt
        if: steps.prepare.outputs.changed == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          CERTIFIED_SHA: ${{ steps.main.outputs.sha }}
          EXPECTED_PROD_SHA: ${{ steps.prepare.outputs.prod_sha }}
          RECEIPT_ID: ${{ steps.receipt.outputs.id }}
          RECEIPT_BLOB: ${{ steps.receipt.outputs.blob }}
          RECEIPT_REF: ${{ steps.receipt.outputs.ref }}
          FRESH_FREEZE_PATH: ${{ runner.temp }}/prod-live-patches-freeze-fresh.json
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/prod-live-patches:refs/remotes/origin/prod-live-patches
          FRESH_MAIN=$(git rev-parse refs/remotes/origin/main)
          FRESH_PROD=$(git rev-parse refs/remotes/origin/prod-live-patches)
          [ "$FRESH_MAIN" = "$CERTIFIED_SHA" ] || {
            echo "::error::CAS failed: origin/main no longer equals certified SHA"
            exit 1
          }
          [ "$FRESH_PROD" = "$EXPECTED_PROD_SHA" ] || {
            echo "::error::CAS failed: prod-live-patches changed during certification"
            exit 1
          }
          git merge-base --is-ancestor "$FRESH_PROD" "$CERTIFIED_SHA" || {
            echo "::error::certified SHA is not a strict descendant"
            exit 1
          }
          [ -z "$(git ls-remote origin "$RECEIPT_REF")" ] || {
            echo "::error::immutable receipt ref already exists"
            exit 1
          }
          # This API read and strict parse intentionally happen after every
          # fetch/CAS/ref preparation operation. There is no command between
          # the final freeze decision and the atomic publication boundary.
          gh api "repos/$REPOSITORY/actions/variables/PROD_LIVE_PATCHES_FREEZE" \
            --jq .value > "$FRESH_FREEZE_PATH"
          python3 scripts/certify_prod_live_patches.py validate-freeze \
            --input "$FRESH_FREEZE_PATH"
          # Git protocol atomic push is the publication boundary: the release
          # branch and immutable receipt ref both advance, or neither does.
          git push --atomic \
            --force-with-lease="refs/heads/prod-live-patches:$FRESH_PROD" \
            --force-with-lease="$RECEIPT_REF:" \
            origin \
            "$CERTIFIED_SHA:refs/heads/prod-live-patches" \
            "$RECEIPT_BLOB:$RECEIPT_REF"
          PUSHED_SHA=$(git ls-remote origin refs/heads/prod-live-patches | awk '{print $1}')
          [ "$PUSHED_SHA" = "$CERTIFIED_SHA" ] || {
            echo "::error::post-push exact-SHA verification failed"
            exit 1
          }
          PUBLISHED_RECEIPT=$(git ls-remote origin "$RECEIPT_REF" | awk '{print $1}')
          [ "$PUBLISHED_RECEIPT" = "$RECEIPT_BLOB" ] || {
            echo "::error::post-push immutable receipt verification failed"
            exit 1
          }

      - name: Record promotion summary
        if: always()
        env:
          CERTIFIED_SHA: ${{ steps.main.outputs.sha }}
          CHANGED: ${{ steps.prepare.outputs.changed }}
          CERTIFICATE_ID: ${{ steps.certificate.outputs.id }}
          RECEIPT_ID: ${{ steps.receipt.outputs.id }}
        run: |
          {
            echo "## prod-live-patches promotion"
            echo "- Certified main SHA: \`$CERTIFIED_SHA\`"
            echo "- Changed: \`${CHANGED:-unknown}\`"
            echo "- Certificate: \`${CERTIFICATE_ID:-not-issued}\`"
            echo "- Receipt: \`${RECEIPT_ID:-not-issued}\`"
          } >> "$GITHUB_STEP_SUMMARY"
