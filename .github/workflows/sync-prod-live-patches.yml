name: Sync prod-live-patches with main

# The mini's deploy branch (prod-live-patches, tracked by release-poll) has
# historically required a manual forward-merge from main. When nobody
# remembers to do it, merged fixes silently never deploy — on 2026-07-28
# prod-live-patches was found 6 commits behind main (task 86e2hw6fp).
#
# This workflow keeps prod-live-patches current automatically:
#   - on every push to main, merge main into prod-live-patches immediately
#   - on a daily schedule, as a safety net in case a push-triggered run
#     was skipped/failed/never fired (e.g. workflow file itself changed)
#   - on-demand via workflow_dispatch
#
# A clean (no-conflict) merge is fast-forwarded/pushed directly to
# prod-live-patches. A conflicting merge is aborted and instead opened as a
# PR against prod-live-patches so a human resolves the conflicts — we never
# want to push an unresolved merge onto the deploy branch.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-prod-live-patches
  cancel-in-progress: false

jobs:
  sync:
    name: Merge main into prod-live-patches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: prod-live-patches

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Attempt merge of origin/main into prod-live-patches
        id: merge
        run: |
          set -euo pipefail

          git fetch origin main prod-live-patches

          # Already up to date — nothing to do.
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "prod-live-patches already contains all of main. Nothing to do."
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit origin/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            # Capture conflicting files before aborting — `git merge --abort`
            # clears the merge state we'd otherwise report on.
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push clean merge to prod-live-patches
        if: steps.merge.outputs.conflict == 'false' && steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:prod-live-patches

      - name: Open PR for conflicting merge
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DATE_TAG=$(date -u +%Y%m%d)
          BRANCH="auto-merge/main-to-prod-live-patches-${DATE_TAG}"

          # Re-run the merge on a temp branch so the conflict markers are
          # visible in the PR diff for whoever resolves them.
          git checkout -b "$BRANCH"
          git merge --no-edit origin/main || true
          git add -A
          git commit -m "chore: conflicted auto-merge of main into prod-live-patches (${DATE_TAG})" || true
          git push --force origin "$BRANCH"

          CONFLICT_FILES="(unknown — see workflow run logs)"
          if [ -s /tmp/conflicts.txt ]; then
            CONFLICT_FILES=$(sed 's/^/- /' /tmp/conflicts.txt)
          fi

          # Build the PR body with printf (not a heredoc) so the literal
          # newlines don't fight YAML's block-scalar indentation rules.
          BODY_FILE="$RUNNER_TEMP/pr-body.md"
          printf '%s\n' \
            "Automated sync from \`main\` into \`prod-live-patches\` (the mini" \
            "deploy branch) hit merge conflicts and could not be fast-forwarded" \
            "automatically." \
            "" \
            "This PR contains the attempted merge with conflict markers left in" \
            "place. Please resolve the conflicts and merge into" \
            "\`prod-live-patches\` so deploys stay current." \
            "" \
            "**Conflicting files:**" \
            "$CONFLICT_FILES" \
            "" \
            "Generated by the \`sync-prod-live-patches\` workflow." \
            > "$BODY_FILE"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --base prod-live-patches --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --head "$BRANCH" --base prod-live-patches \
              --title "Auto-merge main into prod-live-patches (${DATE_TAG}) — conflicts need resolution" \
              --body-file "$BODY_FILE"
          else
            echo "PR #$EXISTING_PR already open for $BRANCH; force-push above updated it."
          fi

          echo "::warning::main → prod-live-patches merge conflicts. See PR for $BRANCH."
