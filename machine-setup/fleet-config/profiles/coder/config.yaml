# coder profile — model config only. Deep-merged onto the default
# ~/.hermes/config.yaml schema by `hermes profile create`/the fleet-config
# installer; unset keys inherit Hermes defaults.
model:
  provider: openai-codex
  default: gpt-5.5
fallback_providers:
  - provider: zai
    model: glm-4.7
  - provider: google
    model: gemini-2.5-flash
