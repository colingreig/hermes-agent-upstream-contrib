# coder profile — model config only. Deep-merged onto the default
# ~/.hermes/config.yaml schema by `hermes profile create`/the fleet-config
# installer; unset keys inherit Hermes defaults.
model:
  provider: openai-codex
  default: gpt-5.5
fallback_providers:
  - provider: zai
    model: glm-4.7
  - provider: nous
    model: deepseek/deepseek-v4-pro
    key_env: NOUS_PORTAL_API_KEY

agent:
  reasoning_overrides:
    deepseek/deepseek-v4-pro: high
